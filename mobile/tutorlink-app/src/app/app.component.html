<ion-app>
  <!-- SIDE MENU -->
  <ion-menu *ngIf="showLayout()" menuId="main-menu" contentId="main-content" side="end" type="overlay"
            [swipeGesture]="false" (ionWillOpen)="loadUser()" class="modern-menu">
    
    <!-- SIDE MENU HEADER -->
    <ion-header class="menu-header">
      <ion-toolbar class="menu-toolbar">
        <div class="menu-profile">
          <div class="avatar-wrapper">
            <ion-icon name="person-circle-outline"></ion-icon>
          </div>
          <div class="user-info">
            <h2>{{ userName() || 'TutorLink User' }}</h2>
            <p>Welcome back!</p>
          </div>
        </div>
      </ion-toolbar>
    </ion-header>

    <!-- SIDE MENU CONTENT -->
    <ion-content class="menu-content">
      <ion-list lines="none" class="menu-list">
        
        <ion-item button (click)="navigate('/home')" class="menu-item">
          <ion-icon name="home-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Home</ion-label>
        </ion-item>
        
        <ion-item button (click)="navigate('/profile')" class="menu-item">
          <ion-icon name="person-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Profile</ion-label>
        </ion-item>
        
        <ion-item button (click)="navigate('/messages')" class="menu-item">
          <ion-icon name="chatbubble-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Messages</ion-label>
          <ion-badge *ngIf="totalUnreadMessages() > 0" color="danger" slot="end" class="menu-badge">
            {{ totalUnreadMessages() }}
          </ion-badge>
        </ion-item>
        
        <ion-item button (click)="navigate('/my-lesson')" class="menu-item">
          <ion-icon name="book-outline" slot="start" color="primary"></ion-icon>
          <ion-label>My Lesson</ion-label>
          <!-- ITO ANG BADGE PARA SA BAGONG MESSAGE SA GC -->
          <ion-badge *ngIf="totalUnreadLessons() > 0" color="danger" slot="end" class="menu-badge">
            {{ totalUnreadLessons() }}
          </ion-badge>
        </ion-item>
        
        <ion-item button (click)="navigate('/settings')" class="menu-item">
          <ion-icon name="settings-outline" slot="start" color="primary"></ion-icon>
          <ion-label>Settings</ion-label>
        </ion-item>

        <div class="menu-divider"></div>
        
        <ion-item button (click)="logout()" class="menu-item logout-item">
          <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
          <ion-label color="danger">Log Out</ion-label>
        </ion-item>
        
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- PAGES -->
  <ion-router-outlet id="main-content" class="main-outlet"></ion-router-outlet>

  <!-- BOTTOM TAB BAR -->
  <ion-tab-bar *ngIf="showLayout()" class="modern-tab-bar" slot="bottom">
    
    <ion-tab-button (click)="goTo('/home')" class="tab-btn">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="goTo('/messages')" class="tab-btn">
      <div class="icon-wrapper">
        <ion-icon name="chatbubble-outline"></ion-icon>
        <ion-badge *ngIf="totalUnreadMessages() > 0" color="danger" class="tab-badge">
          {{ totalUnreadMessages() }}
        </ion-badge>
      </div>
      <ion-label>Messages</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="goTo('/profile')" class="tab-btn">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>

    <ion-tab-button (click)="goTo('/settings')" class="tab-btn">
      <ion-icon name="settings-outline"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>
    
  </ion-tab-bar>
</ion-app>
