<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="page-title">View Post</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  
  <!-- LOADING STATE -->
  <div *ngIf="loading()" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading post...</p>
  </div>

  <!-- POST CONTENT -->
  <div *ngIf="!loading() && post()" class="post-container">
    
    <!-- IMAGE GALLERY -->
    <div class="gallery-container" *ngIf="gallery().length > 0">
      <img *ngFor="let img of gallery()" [src]="img" class="gallery-image" />
    </div>

    <!-- POST CARD -->
    <div class="post-card">
      
      <!-- TUTOR INFO -->
      <div class="header-row">
        <ion-avatar class="tutor-avatar">
          <img [src]="getImageUrl(post()?.tutor_picture)" />
        </ion-avatar>
        <div class="tutor-info">
          <h2>{{ post()?.tutor_name || 'Tutor' }}</h2>
          <span class="education-level">
            <ion-icon name="school-outline"></ion-icon> {{ post()?.education_level }}
          </span>
        </div>
      </div>

      <!-- SUBJECT -->
      <h1 class="post-subject">{{ post()?.subject }}</h1>
      
      <!-- PRICE -->
      <div class="price-tag">
        <ion-icon name="cash-outline"></ion-icon>
        <span>₱{{ post()?.hourly_rate }} / hour</span>
      </div>

      <!-- DESCRIPTION -->
      <p class="post-description">{{ post()?.description }}</p>

      <!-- 🔥 ACTION (PINALITAN ANG TEXT) -->
      <ion-button expand="block" class="message-btn" (click)="goToTutorDetailsWithApply()">
        <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
        Apply Lesson
      </ion-button>
    </div>

  </div>
</ion-content>
