<ion-header class="modern-header">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/profile" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="page-title">System Messages</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  
  <!-- LOADING -->
  <div *ngIf="loading()" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!loading() && messages().length === 0" class="empty-state">
    <div class="icon-circle">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
    </div>
    <h3>No messages from Admin</h3>
    <p>You're all good! System messages will appear here.</p>
  </div>

  <!-- MESSAGES LIST -->
  <div *ngIf="!loading() && messages().length > 0" class="messages-container">
    
    <!-- INFO BANNER -->
    <div class="info-banner">
      <ion-icon name="information-circle-outline" class="info-icon"></ion-icon>
      <p class="info-text">
        <strong>Note:</strong> These are official messages from TutorLink Admin. You cannot reply to this thread.
      </p>
    </div>

    <!-- MESSAGES -->
    <div class="message-card" *ngFor="let msg of messages()">
      <div class="message-header">
        <div class="admin-badge">
          <ion-icon name="shield-checkmark-outline"></ion-icon>
          <strong>TutorLink Admin</strong>
        </div>
      </div>
      <p class="message-body">{{ msg.message }}</p>
      <small class="message-date">{{ msg.created_at | date:'medium' }}</small>
    </div>

  </div>
</ion-content>
