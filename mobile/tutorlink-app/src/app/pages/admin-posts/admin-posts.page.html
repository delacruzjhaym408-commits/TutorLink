<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Manage Posts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  
  <div *ngIf="loading()" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <div *ngIf="!loading() && posts().length === 0" class="ion-text-center ion-padding">
    <p>No posts yet.</p>
  </div>

  <div class="cards-container" *ngIf="!loading() && posts().length > 0">
    <ion-card *ngFor="let post of posts()" class="modern-card" style="padding: 0; overflow: hidden; border-radius: 12px; margin-bottom: 16px;" [style.opacity]="post.status === 'disabled' ? '0.7' : '1'">
      
      <div *ngIf="post.post_pictures" style="width: 100%; height: 220px; background: #f3f4f6; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <img [src]="parseImages(post.post_pictures)[0]" alt="Course Cover" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
      </div>

      <div style="padding: 16px;">
        <h2 class="subject-title" style="font-size: 1.4rem; font-weight: 800; color: #1a1a1a; margin: 0 0 8px 0; line-height: 1.2;">
          {{ post.subject }} 
          <ion-badge color="danger" *ngIf="post.status === 'disabled'">DISABLED</ion-badge>
        </h2>
        
        <p class="tutor-subtitle" style="color: #6b7280; font-size: 0.95rem; margin-bottom: 12px;">
          Tutor: <strong>{{ post.tutor_name || 'Unknown' }}</strong>
        </p>

        <p *ngIf="post.status === 'disabled'" style="color: #eb445a; font-size: 0.8rem; margin-bottom: 8px;">
          Reason: {{ post.disabled_reason }}
        </p>

        <!-- Stats, Rate, Date (Puwede mong i-keep yung dating design mo dito) -->

        <!-- ACTION BUTTONS -->
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <ion-button expand="block" fill="solid" color="warning" *ngIf="post.status !== 'disabled'" (click)="confirmDisable(post)" style="flex: 1;">
            <ion-icon name="ban-outline" slot="start"></ion-icon> Disable
          </ion-button>
          
          <ion-button expand="block" fill="solid" color="success" *ngIf="post.status === 'disabled'" (click)="confirmEnable(post)" style="flex: 1;">
            <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon> Enable
          </ion-button>

          <ion-button expand="block" fill="solid" color="danger" (click)="confirmDelete(post)" style="flex: 1;">
            <ion-icon name="trash-outline" slot="start"></ion-icon> Delete
          </ion-button>
        </div>
      </div>
    </ion-card>
  </div>
</ion-content>
