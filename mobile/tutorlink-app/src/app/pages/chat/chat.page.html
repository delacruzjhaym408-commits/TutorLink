<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar color="primary" class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/messages" class="menu-btn"></ion-back-button>
    </ion-buttons>
    
    <ion-title class="chat-title">
      <div style="display: flex; align-items: center; gap: 10px;">
        <!-- 🔥 GREEN DOT SA CHAT HEADER -->
        <ion-avatar style="width: 36px; height: 36px; border: 2px solid #e5e7eb; position: relative;">
          <img [src]="otherUserPicture() || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
          <span *ngIf="otherUserIsOnline()" style="position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background-color: #10b981; border-radius: 50%; border: 2px solid #fff;"></span>
        </ion-avatar>
        <span class="chat-name">{{ otherUserName() }}</span>
      </div>
    </ion-title>

    <ion-buttons slot="end" *ngIf="currentUser?.role === 'student'">
      <ion-button (click)="bookSession()" fill="solid" color="light" size="small" style="margin-right: 8px; font-weight: 700;">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        Book
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="bg-content" #content>
  <div *ngIf="loading()" class="ion-text-center loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading messages...</p>
  </div>

  <div class="messages-container" *ngIf="!loading()">
    <div 
      *ngFor="let msg of messages()" 
      class="message-row"
      [class.mine]="isMine(msg)"
    >
      <ion-avatar class="sender-avatar" *ngIf="!isMine(msg)">
        <img [src]="msg.sender_picture || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
      </ion-avatar>

      <div class="message-bubble">
        <span class="sender-name" *ngIf="!isMine(msg)">{{ msg.sender_name }}</span>
        
        <div 
          *ngIf="msg.post_subject" 
          class="embedded-post" 
          (click)="goToPost(msg.post_id)"
        >
          <img 
            *ngIf="msg.post_picture" 
            [src]="getImageUrl(msg.post_picture)" 
            class="embedded-post-image" 
            alt="post" 
          />
          <div class="embedded-post-content">
            <span class="embedded-post-label">📌 Shared Post</span>
            <h4 class="embedded-post-subject">{{ msg.post_subject }}</h4>
            <span class="embedded-post-cta">Click to view post →</span>
          </div>
        </div>

        <div *ngIf="msg.content.startsWith('[IMAGE]')" class="image-message">
          <img [src]="msg.content.replace('[IMAGE]', '')" alt="Sent Image" style="max-width: 100%; border-radius: 8px;" />
        </div>

        <div *ngIf="!msg.content.startsWith('[IMAGE]')">
          <p class="message-text">{{ msg.content }}</p>
        </div>

        <small class="message-time">{{ msg.created_at | date:'shortTime' }}</small>
      </div>
    </div>
    
    <div *ngIf="messages().length === 0" class="ion-text-center empty-state">
      <ion-icon name="chatbubbles-outline" class="empty-icon"></ion-icon>
      <h3>No messages yet</h3>
      <p>Say hello to start the conversation! 👋</p>
    </div>
  </div>
</ion-content>

<ion-footer class="modern-footer">
  <ion-toolbar class="footer-toolbar">
    <div class="input-container">
      <ion-button fill="clear" (click)="sendImage()" class="camera-btn" [disabled]="sending()">
        <ion-icon name="camera-outline" slot="icon-only" color="medium"></ion-icon>
      </ion-button>

      <ion-input
        [(ngModel)]="newMessage"
        placeholder="Type a message..."
        (keyup.enter)="send()"
        class="chat-input"
      ></ion-input>
      
      <ion-button 
        (click)="send()" 
        [disabled]="sending() || !newMessage.trim()"
        class="send-btn"
        shape="round"
      >
        <ion-icon name="send" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
