<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar class="header-toolbar" color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/messages" class="back-btn"></ion-back-button>
    </ion-buttons>
    
    <ion-title class="chat-title">
      <div class="chat-user-info">
        <ion-avatar class="header-avatar">
          <img [src]="otherUserPicture() || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
          <span *ngIf="otherUserIsOnline()" class="online-dot"></span>
        </ion-avatar>
        <span class="chat-name">{{ otherUserName() }}</span>
      </div>
    </ion-title>

    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="goToTutorDetails()" style="color: white;">
        <ion-icon name="person-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content" #content>
  
  <!-- LOADING STATE -->
  <div *ngIf="loading()" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading messages...</p>
  </div>

  <!-- MESSAGES -->
  <div class="messages-container" *ngIf="!loading()">
    <div 
      *ngFor="let msg of messages(); let i = index" 
      class="message-row"
      [class.mine]="isMine(msg)"
      (contextmenu)="deleteMessage(msg)">
      
      <!-- SENDER AVATAR (NOT MINE) -->
      <ion-avatar class="sender-avatar" *ngIf="!isMine(msg)">
        <img [src]="msg.sender_picture || 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
      </ion-avatar>

      <div class="message-bubble">
        <span class="sender-name" *ngIf="!isMine(msg)">{{ msg.sender_name }}</span>
        
        <!-- 🔥 SHARED POST: IPAPAKITA LANG SA PINAKA-UNANG MESSAGE (INDEX 0) -->
        <div 
          *ngIf="msg.post_subject && i === 0" 
          class="embedded-post" 
          (click)="goToPost(msg.post_id)">
          <img 
            *ngIf="msg.post_picture" 
            [src]="getImageUrl(msg.post_picture)" 
            class="embedded-post-image" 
            alt="post" 
          />
          <div class="embedded-post-content">
            <span class="embedded-post-label">📌 Shared Post</span>
            <h4 class="embedded-post-subject">{{ msg.post_subject }}</h4>
            <span class="embedded-post-cta">Click to view post →</span>
          </div>
        </div>

        <!-- IMAGE MESSAGE -->
        <div *ngIf="msg.content.startsWith('[IMAGE]')" class="image-message">
          <img [src]="msg.content.replace('[IMAGE]', '')" alt="Sent Image" />
        </div>

        <!-- TEXT MESSAGE -->
        <div *ngIf="!msg.content.startsWith('[IMAGE]')">
          <p class="message-text">{{ msg.content }}</p>
        </div>

        <small class="message-time">{{ msg.created_at | date:'shortTime' }}</small>
      </div>
    </div>
    
    <!-- EMPTY STATE -->
    <div *ngIf="messages().length === 0" class="empty-state">
      <div class="icon-circle">
        <ion-icon name="chatbubbles-outline"></ion-icon>
      </div>
      <h3>No messages yet</h3>
      <p>Say hello to start the conversation! 👋</p>
    </div>
  </div>
</ion-content>

<!-- MODERN FOOTER -->
<ion-footer class="modern-footer">
  <ion-toolbar class="footer-toolbar">
    <div class="input-container">
      <ion-button fill="clear" (click)="sendImage()" class="camera-btn" [disabled]="sending()">
        <ion-icon name="camera-outline" slot="icon-only"></ion-icon>
      </ion-button>

      <ion-input
        [(ngModel)]="newMessage"
        placeholder="Type a message..."
        (keyup.enter)="send()"
        class="chat-input"
      ></ion-input>
      
      <ion-button 
        (click)="send()" 
        [disabled]="sending() || !newMessage.trim()"
        class="send-btn"
        shape="round">
        <ion-icon name="send" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
