<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start"><ion-back-button defaultHref="/admin/dashboard"></ion-back-button></ion-buttons>
    <ion-title>Appeals</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="appeals().length === 0" class="ion-text-center ion-padding">
    <p>No appeals found.</p>
  </div>

  <ion-list>
    <ion-item *ngFor="let appeal of appeals()">
      <ion-label>
        <h2>
          {{ appeal.user_name }} 
          <ion-badge color="warning" *ngIf="appeal.status === 'pending'">{{ appeal.status }}</ion-badge>
        </h2>
        <p>{{ appeal.email }}</p>
        <p style="color: #666; font-style: italic;">"{{ appeal.reason }}"</p>
      </ion-label>

      <div slot="end" style="display: flex; gap: 4px;">
        <!-- 🔥 ENABLE BUTTON -->
        <ion-button fill="clear" color="success" *ngIf="appeal.status === 'pending'" (click)="approveAppeal(appeal.user_id)">
          <ion-icon name="checkmark-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <!-- 🔥 DELETE BUTTON -->
        <ion-button fill="clear" color="danger" (click)="confirmDelete(appeal)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
