<ion-header class="modern-header">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="page-title">Appeals</ion-title>
  </ion-toolbar>
  
  <ion-toolbar class="segment-toolbar">
    <ion-segment [(ngModel)]="activeTab" (ionChange)="onTabChange($event)" class="modern-segment">
      <ion-segment-button value="pending">
        <ion-label>Pending</ion-label>
      </ion-segment-button>
      <ion-segment-button value="approved">
        <ion-label>Approved</ion-label>
      </ion-segment-button>
      <ion-segment-button value="rejected">
        <ion-label>Rejected</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <!-- EMPTY STATE -->
  <div *ngIf="getFilteredAppeals().length === 0" class="empty-state">
    <div class="icon-circle">
      <ion-icon name="document-text-outline"></ion-icon>
    </div>
    <h3>No {{ activeTab() }} appeals</h3>
    <p>There are currently no appeals in this category.</p>
  </div>

  <!-- APPEALS LIST -->
  <div class="appeals-list" *ngIf="getFilteredAppeals().length > 0">
    <div class="appeal-card" *ngFor="let appeal of getFilteredAppeals()">
      
      <div class="appeal-header">
        <h2 class="appeal-name">{{ appeal.user_name }}</h2>
        <ion-badge 
          class="status-badge"
          [ngClass]="{
            'status-pending': appeal.status === 'pending',
            'status-approved': appeal.status === 'approved',
            'status-rejected': appeal.status === 'rejected'
          }">
          {{ appeal.status | uppercase }}
        </ion-badge>
      </div>

      <p class="appeal-email">{{ appeal.email }}</p>
      
      <div class="appeal-reason-box">
        <p class="appeal-reason">"{{ appeal.reason }}"</p>
      </div>

      <p class="appeal-date">{{ appeal.created_at | date:'medium' }}</p>

      <!-- ACTIONS -->
      <div class="appeal-actions" *ngIf="appeal.status === 'pending'">
        <ion-button fill="clear" class="action-btn success-btn" (click)="approveAppeal(appeal.id)">
          <ion-icon name="checkmark-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="action-btn danger-btn" (click)="rejectAppeal(appeal.id)">
          <ion-icon name="close-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button fill="clear" class="action-btn neutral-btn" (click)="confirmDelete(appeal)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

      <div class="appeal-actions" *ngIf="appeal.status !== 'pending'">
        <ion-button fill="clear" class="action-btn neutral-btn" (click)="confirmDelete(appeal)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>
