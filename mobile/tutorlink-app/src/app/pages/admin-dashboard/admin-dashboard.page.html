<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Admin Dashboard</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Welcome, Admin</h2>
  <p>Overview of the TutorLink System</p>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="4">
        <ion-card (click)="goToUsers()" style="cursor: pointer; background: #e3f2fd;">
          <ion-card-header>
            <ion-icon name="people-outline" size="large" color="primary"></ion-icon>
            <ion-card-title>Manage Users</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h1>{{ totalUsers() }}</h1>
            <p>Total Users</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card (click)="goToPosts()" style="cursor: pointer; background: #e8f5e9;">
          <ion-card-header>
            <ion-icon name="document-text-outline" size="large" color="success"></ion-icon>
            <ion-card-title>Manage Posts</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h1>{{ totalPosts() }}</h1>
            <p>Total Posts</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="4">
        <ion-card (click)="goToReports()" style="cursor: pointer; background: #ffebee;">
          <ion-card-header>
            <ion-icon name="warning-outline" size="large" color="danger"></ion-icon>
            <ion-card-title>Reports</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <h1>{{ totalReports() }}</h1>
            <p>Total Reports</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
