<ion-header class="modern-header">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="page-title">Manage Users</ion-title>
  </ion-toolbar>

  <!-- SEARCH BAR -->
  <ion-toolbar class="search-toolbar">
    <ion-searchbar 
      placeholder="Search by name or email..." 
      (ionInput)="onSearchChange($event)" 
      [debounce]="300"
      class="modern-search">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  
  <!-- LOADING STATE -->
  <div *ngIf="loading()" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="!loading() && filteredUsers.length === 0" class="empty-state">
    <div class="icon-circle">
      <ion-icon name="people-outline"></ion-icon>
    </div>
    <h3>No users found</h3>
    <p>Try adjusting your search or wait for new registrations.</p>
  </div>

  <!-- USERS LIST -->
  <div class="users-list" *ngIf="!loading() && filteredUsers.length > 0">
    <div class="user-card" *ngFor="let user of filteredUsers">
      
      <div class="user-main">
        <ion-avatar class="user-avatar" [class.disabled-avatar]="!user.is_active">
          <img [src]="getProfilePictureUrl(user.profile_picture)" />
        </ion-avatar>
        
        <div class="user-details">
          <div class="user-header">
            <h2 class="user-name">{{ user.full_name }}</h2>
            <ion-badge color="danger" *ngIf="!user.is_active" class="status-badge">DISABLED</ion-badge>
          </div>
          <p class="user-email">{{ user.email }}</p>
          <p class="user-role">Role: <strong>{{ user.role | titlecase }}</strong></p>
          
          <p *ngIf="!user.is_active && user.disabled_reason" class="disabled-reason">
            <strong>Reason:</strong> {{ user.disabled_reason }}
          </p>
        </div>
      </div>

      <div class="user-actions">
        <!-- ENABLE BUTTON -->
        <ion-button fill="solid" class="action-btn enable-btn" *ngIf="!user.is_active" (click)="confirmEnable(user)" title="Enable User">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
        </ion-button>

        <!-- DISABLE BUTTON -->
        <ion-button fill="solid" class="action-btn disable-btn" *ngIf="user.is_active" (click)="confirmDisable(user)" title="Disable User">
          <ion-icon name="ban-outline"></ion-icon>
        </ion-button>

        <!-- DELETE BUTTON -->
        <ion-button fill="solid" class="action-btn delete-btn" (click)="confirmDelete(user)" title="Delete User">
          <ion-icon name="trash-outline"></ion-icon>
        </ion-button>
      </div>

    </div>
  </div>
</ion-content>
