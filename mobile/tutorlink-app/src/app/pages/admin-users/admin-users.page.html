<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Manage Users</ion-title>
  </ion-toolbar>

  <!-- SEARCH BAR -->
  <ion-toolbar>
    <ion-searchbar 
      placeholder="Search by name or email..." 
      (ionInput)="onSearchChange($event)" 
      [debounce]="300">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  
  <div *ngIf="loading()" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <div *ngIf="!loading() && filteredUsers.length === 0" class="ion-text-center ion-padding">
    <p>No users found.</p>
  </div>

  <ion-list *ngIf="!loading() && filteredUsers.length > 0">
    <ion-item *ngFor="let user of filteredUsers">
      <ion-avatar slot="start">
        <img [src]="getProfilePictureUrl(user.profile_picture)" [style.opacity]="user.is_active ? '1' : '0.5'" />
      </ion-avatar>
      
      <ion-label>
        <h2>
          {{ user.full_name }}
          <ion-badge color="danger" *ngIf="!user.is_active" style="margin-left: 8px;">DISABLED</ion-badge>
        </h2>
        <p>{{ user.email }} · <strong>{{ user.role }}</strong></p>
        <p *ngIf="!user.is_active" style="color: #eb445a; font-size: 0.8rem;">
          Reason: {{ user.disabled_reason }}
        </p>
      </ion-label>

      <div slot="end" style="display: flex; gap: 4px;">
        <!-- ENABLE BUTTON -->
        <ion-button fill="clear" color="success" *ngIf="!user.is_active" (click)="confirmEnable(user)" title="Enable User">
          <ion-icon name="checkmark-circle-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <!-- DISABLE BUTTON -->
        <ion-button fill="clear" color="warning" *ngIf="user.is_active" (click)="confirmDisable(user)" title="Disable User">
          <ion-icon name="ban-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <!-- DELETE BUTTON -->
        <ion-button fill="clear" color="danger" (click)="confirmDelete(user)" title="Delete User">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </ion-item>
  </ion-list>
</ion-content>
