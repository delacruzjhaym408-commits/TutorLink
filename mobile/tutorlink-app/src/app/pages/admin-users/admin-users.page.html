<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Manage Users</ion-title>
  </ion-toolbar>

  <!-- SEARCH BAR -->
  <ion-toolbar>
    <ion-searchbar 
      placeholder="Search by name or email..." 
      (ionInput)="onSearchChange($event)" 
      [debounce]="300">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="loading()" class="ion-text-center ion-padding"><ion-spinner></ion-spinner></div>

  <div *ngIf="!loading() && filteredUsers.length === 0" class="ion-text-center ion-padding">
    <p>No users found.</p>
  </div>

  <ion-list *ngIf="!loading() && filteredUsers.length > 0">
    <ion-item *ngFor="let user of filteredUsers">
      <!-- IDINAGDAG: Ginamit ang getProfilePictureUrl() -->
      <ion-avatar slot="start">
        <img [src]="getProfilePictureUrl(user.profile_picture)" />
      </ion-avatar>
      <ion-label>
        <h2>{{ user.full_name }}</h2>
        <p>{{ user.email }} · <strong>{{ user.role }}</strong></p>
      </ion-label>
      <ion-button fill="clear" color="danger" slot="end" (click)="confirmDelete(user)">
        <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
