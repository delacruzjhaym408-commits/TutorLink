<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" class="back-btn"></ion-back-button>
    </ion-buttons>
    <ion-title class="page-title">My Schedule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-content ion-padding">
  
  <!-- LOADING STATE -->
  <div *ngIf="loading()" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Loading schedule...</p>
  </div>

  <div *ngIf="!loading()" class="calendar-container">
    
    <!-- CALENDAR VIEW -->
    <div class="calendar-wrapper">
      <ion-datetime 
        presentation="date" 
        [value]="selectedDate()" 
        (ionChange)="onDateChange($event)"
        [highlightedDates]="highlightedDates()"
        color="primary"
        class="modern-datetime">
      </ion-datetime>
    </div>

    <!-- LEGEND -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot"></div>
        <span>Available Date</span>
      </div>
    </div>

    <!-- SELECTED DAY SCHEDULE -->
    <div class="schedule-section">
      <h3 class="section-title">
        Schedule for <span class="highlight-date">{{ selectedDateFormatted() }}</span>
      </h3>
      
      <!-- EMPTY SCHEDULE -->
      <div *ngIf="getAvailabilitiesForSelectedDay().length === 0" class="no-schedule">
        <ion-icon name="calendar-outline"></ion-icon>
        <p>No available time set for this date.</p>
      </div>

      <!-- SCHEDULE LIST -->
      <div class="time-list" *ngIf="getAvailabilitiesForSelectedDay().length > 0">
        <div *ngFor="let a of getAvailabilitiesForSelectedDay()" class="time-card">
          <div class="time-info">
            <ion-icon name="time-outline" class="time-icon"></ion-icon>
            <h2 class="time-text">{{ a.start_time }} - {{ a.end_time }}</h2>
          </div>
          
          <!-- TUTOR-ONLY: Delete Button -->
          <ion-button *ngIf="role() === 'tutor'" fill="solid" class="delete-btn" (click)="deleteAvailability(a.id)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </div>

      <!-- TUTOR-ONLY: Add Time Button -->
      <ion-button *ngIf="role() === 'tutor'" (click)="addModal.present()" expand="block" class="add-btn">
        <ion-icon name="add-outline" slot="start"></ion-icon>
        Add Time for {{ selectedDateFormatted() }}
      </ion-button>
    </div>
  </div>

  <!-- MODAL FOR ADDING SCHEDULE -->
  <ion-modal #addModal class="modern-modal">
    <ng-template>
      <ion-header class="modern-header">
        <ion-toolbar class="header-toolbar">
          <ion-title class="page-title">Add Schedule</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="addModal.dismiss()" class="close-btn">Close</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="modal-content">
        <p class="modal-subtext">Date: <strong>{{ selectedDateFormatted() }}</strong></p>
        
        <div class="input-group">
          <label>Start Time</label>
          <ion-input type="time" [(ngModel)]="startTime" class="custom-input"></ion-input>
        </div>
        
        <div class="input-group">
          <label>End Time</label>
          <ion-input type="time" [(ngModel)]="endTime" class="custom-input"></ion-input>
        </div>
        
        <ion-button expand="block" class="save-btn" (click)="addAvailability()">
          Save Schedule
        </ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
